<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Inner shine -->
  <rect width="32" height="16" rx="7" fill="url(#shine)"/>

  <!-- Cloud body -->
  <path d="M7 21.5a3.5 3.5 0 01-.96-6.87 4.5 4.5 0 018.72-1.62 2.5 2.5 0 013.2 3.31A3.25 3.25 0 0125 21.5H7z"
        stroke="white" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"
        fill="rgba(255,255,255,0.12)"/>

  <!-- Sparkle top-right -->
  <path d="M24 6.5l.6 1.8 1.8.6-1.8.6-.6 1.8-.6-1.8-1.8-.6 1.8-.6z"
        fill="white" opacity="0.95"/>

  <!-- Smaller sparkle -->
  <path d="M20.5 5l.35 1.05L22 6.4l-1.15.35L20.5 7.8l-.35-1.05L19 6.4l1.15-.35z"
        fill="white" opacity="0.6"/>
</svg>
