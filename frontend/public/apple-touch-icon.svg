<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="white" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Inner shine highlight -->
  <rect width="180" height="90" rx="40" fill="url(#shine)"/>

  <!-- Cloud -->
  <path d="M38 130a22 22 0 01-6-43.2A28 28 0 0186 77.4a15.5 15.5 0 0121 20.7A20.5 20.5 0 01142 130H38z"
        stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"
        fill="rgba(255,255,255,0.15)"/>

  <!-- Upload arrow on cloud -->
  <path d="M90 120V95M90 95l-10 10M90 95l10 10"
        stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Large sparkle -->
  <path d="M140 38l3.5 10.5L154 52l-10.5 3.5L140 66l-3.5-10.5L126 52l10.5-3.5z"
        fill="white" opacity="0.95"/>

  <!-- Small sparkle -->
  <path d="M155 28l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"
        fill="white" opacity="0.65"/>

  <!-- Tiny dot sparkle -->
  <circle cx="120" cy="44" r="3" fill="white" opacity="0.5"/>
</svg>
