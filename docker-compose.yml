services:

  backend:
    build:
      context: ./backend        # build context is the backend/ folder
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Allow browser requests from the frontend origin
      FRONTEND_URL: http://localhost:3000
      # Public URL the browser can reach — used to build the OAuth callback URI
      BACKEND_URL: http://localhost:8000
      # Point config.py at the bind-mounted credentials directory
      CONFIG_DIR: /app/config
      # Cloudflare D1 credentials — set these in a .env file or host environment
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_D1_DATABASE_ID: ${CF_D1_DATABASE_ID}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      # Google OAuth credentials — place credentials.json here before starting
      - ./config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend       # build context is the frontend/ folder
      dockerfile: Dockerfile
      args:
        # Server-side Next.js rewrites resolve via the Docker network service name
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
