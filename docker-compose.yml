services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      FRONTEND_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
      CONFIG_DIR: /app/config
      # PocketBase — point to your hosted instance
      PB_URL: ${PB_URL:-https://data.genericxinus.com}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      # Secrets — generate with: python backend/scripts/setup_pocketbase.py
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  webdav:
    build:
      context: .
      dockerfile: webdav/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PB_URL: ${PB_URL:-https://data.genericxinus.com}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CREDENTIALS_PATH: /app/config/credentials.json
      WEBDAV_PORT: "8080"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped
