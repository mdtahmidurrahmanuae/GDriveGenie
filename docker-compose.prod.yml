services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FRONTEND_URL: https://gdrive.genericxinus.com
      BACKEND_URL: https://gdrive.genericxinus.com
      CONFIG_DIR: /app/config
      PB_URL: ${PB_URL}
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked in at build time — Next.js server-side rewrites use the Docker
        # internal network name to reach the backend container
        NEXT_PUBLIC_API_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gdrivegenie.rule=Host(`gdrive.genericxinus.com`)"
      - "traefik.http.routers.gdrivegenie.entrypoints=web,websecure"
      - "traefik.http.routers.gdrivegenie.tls=true"
      - "traefik.http.routers.gdrivegenie.tls.certresolver=letsencrypt"
      - "traefik.http.services.gdrivegenie.loadbalancer.server.port=80"
      - "traefik.docker.network=dokploy-network"

networks:
  dokploy-network:
    external: true
